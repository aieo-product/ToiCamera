<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToiCamera 3D 組立シミュレーター</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070a;
      --panel: rgba(8, 13, 19, 0.9);
      --line: rgba(61, 222, 255, 0.24);
      --cyan: #3ddeff;
      --yellow: #ffd84a;
      --muted: #8da0ad;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      font-family: Inter, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }

    #viewport { position: fixed; inset: 0; }

    #title-panel,
    #control-panel,
    #legend {
      position: fixed;
      z-index: 10;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
    }

    #title-panel {
      top: 18px;
      left: 18px;
      max-width: min(440px, calc(100vw - 36px));
      padding: 15px 18px 16px;
      border-left: 3px solid var(--yellow);
    }

    #title-panel h1 {
      margin: 0 0 5px;
      color: #fff;
      font-size: clamp(18px, 2.3vw, 28px);
      letter-spacing: 0.04em;
    }

    #title-panel p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin-bottom: 7px;
      color: var(--yellow);
      font: 700 10px/1 monospace;
      letter-spacing: 0.15em;
    }

    #control-panel {
      right: 18px;
      bottom: 18px;
      width: min(390px, calc(100vw - 36px));
      padding: 14px 16px 16px;
    }

    .control-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #e8fbff;
      font-size: 12px;
      font-weight: 700;
    }

    #explode-value {
      color: var(--yellow);
      font: 700 12px/1 monospace;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--yellow);
      cursor: ew-resize;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    #legend {
      left: 18px;
      bottom: 18px;
      width: 245px;
      padding: 13px 15px;
    }

    #legend h2 {
      margin: 0 0 9px;
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .wire-row {
      display: grid;
      grid-template-columns: 12px 40px 1fr;
      gap: 7px;
      align-items: center;
      margin: 6px 0;
      color: #d7e0e5;
      font-size: 11px;
    }

    .swatch {
      width: 10px;
      height: 3px;
      border-radius: 4px;
      box-shadow: 0 0 8px currentColor;
    }

    .wire-name { font-family: ui-monospace, SFMono-Regular, monospace; }
    .wire-destination { color: var(--muted); }

    .part-label {
      padding: 4px 7px;
      border: 1px solid rgba(61, 222, 255, 0.45);
      border-radius: 3px;
      background: rgba(3, 8, 12, 0.88);
      color: #eafbff;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .part-label::before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-right: 5px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 8px var(--yellow);
    }

    #hint {
      position: fixed;
      z-index: 9;
      top: 19px;
      right: 19px;
      color: rgba(218, 242, 249, 0.58);
      font-size: 10px;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      #legend { display: none; }
      #hint { top: auto; right: auto; left: 18px; bottom: 128px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="viewport" aria-label="ToiCamera 3D 組立ビュー"></main>

  <section id="title-panel">
    <span class="badge">ISSUE #5 / ASSEMBLY VIEW</span>
    <h1>ToiCamera 一体型ケース</h1>
    <p>表示寸法は mm。前面に StopWatch と CamS3、背面フタ側に GPS アンテナを配置しています。</p>
  </section>

  <div id="hint">ドラッグ: 回転 ・ ホイール: ズーム ・ 右ドラッグ: 移動</div>

  <section id="legend" aria-label="Grove 配線凡例">
    <h2>GROVE Y ハーネス</h2>
    <div class="wire-row"><span class="swatch" style="color:#ff4b4b;background:#ff4b4b"></span><span class="wire-name">赤 5V</span><span class="wire-destination">CamS3 + GPS</span></div>
    <div class="wire-row"><span class="swatch" style="color:#252d38;background:#252d38"></span><span class="wire-name">黒 GND</span><span class="wire-destination">CamS3 + GPS</span></div>
    <div class="wire-row"><span class="swatch" style="color:#ffd84a;background:#ffd84a"></span><span class="wire-name">黄 G10</span><span class="wire-destination">GPS のみ</span></div>
    <div class="wire-row"><span class="swatch" style="color:#f5f8ff;background:#f5f8ff"></span><span class="wire-name">白 G11</span><span class="wire-destination">GPS のみ</span></div>
  </section>

  <section id="control-panel">
    <div class="control-head">
      <label for="explode">組立 ⇔ 分解</label>
      <output id="explode-value" for="explode">0%</output>
    </div>
    <input id="explode" type="range" min="0" max="100" value="0" step="1">
    <div class="range-labels"><span>ASSEMBLED</span><span>EXPLODED</span></div>
  </section>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { CSS2DObject, CSS2DRenderer } from "three/addons/renderers/CSS2DRenderer.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const viewport = document.querySelector("#viewport");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070a);
    scene.fog = new THREE.FogExp2(0x05070a, 0.0024);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 900);
    camera.position.set(125, 102, 165);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    viewport.append(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = "fixed";
    labelRenderer.domElement.style.inset = "0";
    labelRenderer.domElement.style.pointerEvents = "none";
    viewport.append(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.minDistance = 65;
    controls.maxDistance = 420;
    controls.target.set(0, 41, 0);

    scene.add(new THREE.HemisphereLight(0x9eeeff, 0x090b12, 2.0));
    const keyLight = new THREE.DirectionalLight(0xffffff, 3.4);
    keyLight.position.set(90, 130, 110);
    scene.add(keyLight);
    const cyanLight = new THREE.PointLight(0x25d9ff, 1200, 260);
    cyanLight.position.set(-95, 55, 50);
    scene.add(cyanLight);
    const yellowLight = new THREE.PointLight(0xffd84a, 900, 220);
    yellowLight.position.set(80, 35, -75);
    scene.add(yellowLight);

    const grid = new THREE.GridHelper(260, 26, 0x174453, 0x10232b);
    grid.position.y = -4;
    scene.add(grid);

    const materials = {
      case: new THREE.MeshPhysicalMaterial({
        color: 0x28d8ff,
        transparent: true,
        opacity: 0.13,
        roughness: 0.25,
        metalness: 0.05,
        transmission: 0.18,
        depthWrite: false,
        side: THREE.DoubleSide
      }),
      lid: new THREE.MeshPhysicalMaterial({
        color: 0xffd84a,
        transparent: true,
        opacity: 0.2,
        roughness: 0.28,
        depthWrite: false,
        side: THREE.DoubleSide
      }),
      watch: new THREE.MeshStandardMaterial({ color: 0x171b22, roughness: 0.45, metalness: 0.42 }),
      display: new THREE.MeshPhysicalMaterial({ color: 0x061018, emissive: 0x0e8fab, emissiveIntensity: 0.65, roughness: 0.16 }),
      cam: new THREE.MeshStandardMaterial({ color: 0x242a32, roughness: 0.58 }),
      gps: new THREE.MeshStandardMaterial({ color: 0x164b42, roughness: 0.62 }),
      antenna: new THREE.MeshStandardMaterial({ color: 0xd6c49a, roughness: 0.78 }),
      lens: new THREE.MeshPhysicalMaterial({ color: 0x07111b, roughness: 0.08, metalness: 0.22, clearcoat: 1.0 }),
      port: new THREE.MeshStandardMaterial({ color: 0xffd84a, emissive: 0x5c4100, emissiveIntensity: 0.7 })
    };

    const addEdges = (mesh, color, opacity = 0.8) => {
      const edgeMaterial = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 18), edgeMaterial);
      mesh.add(edges);
    };

    const addLabel = (group, text, position) => {
      const element = document.createElement("div");
      element.className = "part-label";
      element.textContent = text;
      const label = new CSS2DObject(element);
      label.position.copy(position);
      group.add(label);
    };

    const addRoundedPart = (group, size, position, radius, material, edgeColor) => {
      const geometry = new RoundedBoxGeometry(size.x, size.y, size.z, 5, radius);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(position);
      group.add(mesh);
      if (edgeColor !== undefined) addEdges(mesh, edgeColor, 0.68);
      return mesh;
    };

    const assemblies = [];
    const register = (group, base, explode) => {
      group.userData.base = base.clone();
      group.userData.explode = explode.clone();
      group.position.copy(base);
      scene.add(group);
      assemblies.push(group);
      return group;
    };

    // Case body: 56.4 mm watch zone over a 61.4 mm wiring pod, 23.8 mm deep.
    const shellGroup = register(new THREE.Group(), new THREE.Vector3(), new THREE.Vector3());
    addRoundedPart(shellGroup, new THREE.Vector3(56.4, 56.9, 23.8), new THREE.Vector3(0, 54.85, -0.6), 2.0, materials.case, 0x3ddeff);
    addRoundedPart(shellGroup, new THREE.Vector3(61.4, 28.9, 23.8), new THREE.Vector3(0, 14.45, -0.6), 2.0, materials.case, 0x3ddeff);
    const displayRim = new THREE.Mesh(new THREE.TorusGeometry(24, 0.55, 10, 96), materials.case);
    displayRim.position.set(0, 55.1, -12.55);
    shellGroup.add(displayRim);
    const lensRim = new THREE.Mesh(new THREE.TorusGeometry(5, 0.48, 10, 64), materials.case);
    lensRim.position.set(-20.5, 14.2, -12.55);
    shellGroup.add(lensRim);
    addLabel(shellGroup, "本体シェル / PLA 2.0 mm", new THREE.Vector3(-30, 85, -2));

    // Rear cover is 1.2 mm everywhere over the GPS antenna region.
    const lidGroup = register(new THREE.Group(), new THREE.Vector3(), new THREE.Vector3(0, 0, 46));
    addRoundedPart(lidGroup, new THREE.Vector3(56.4, 56.9, 1.2), new THREE.Vector3(0, 54.85, 11.9), 1.0, materials.lid, 0xffd84a);
    addRoundedPart(lidGroup, new THREE.Vector3(61.4, 28.9, 1.2), new THREE.Vector3(0, 14.45, 11.9), 1.0, materials.lid, 0xffd84a);
    addLabel(lidGroup, "背面フタ / アンテナ側 1.2 mm", new THREE.Vector3(0, 42, 14));

    // StopWatch: measured 52 x 52 x 15.5, represented as the round watch body + display disk.
    const watchGroup = register(new THREE.Group(), new THREE.Vector3(0, 55.1, -2.75), new THREE.Vector3(0, 31, -38));
    const watchBody = new THREE.Mesh(new THREE.CylinderGeometry(26, 26, 15.5, 96), materials.watch);
    watchBody.rotation.x = Math.PI / 2;
    watchGroup.add(watchBody);
    addEdges(watchBody, 0x768b98, 0.56);
    const screen = new THREE.Mesh(new THREE.CylinderGeometry(23.9, 23.9, 0.8, 96), materials.display);
    screen.rotation.x = Math.PI / 2;
    screen.position.z = -8.05;
    watchGroup.add(screen);
    const watchPort = new THREE.Mesh(new THREE.BoxGeometry(8, 3.2, 5), materials.port);
    watchPort.position.set(19.5, -24.8, 3.0);
    watchGroup.add(watchPort);
    addLabel(watchGroup, "M5Stack StopWatch C152 / 52×52×15.5", new THREE.Vector3(0, 31, 1));

    // CamS3 lies across the pod, lens toward the front skin.
    const camGroup = register(new THREE.Group(), new THREE.Vector3(-8.5, 14.2, -4.8), new THREE.Vector3(-40, -19, -27));
    const camBody = addRoundedPart(camGroup, new THREE.Vector3(40, 24, 11), new THREE.Vector3(), 1.4, materials.cam, 0x8193a0);
    const lens = new THREE.Mesh(new THREE.CylinderGeometry(5.4, 5.8, 3.2, 64), materials.lens);
    lens.rotation.x = Math.PI / 2;
    lens.position.set(-12, 0, -7.0);
    camGroup.add(lens);
    const camPort = new THREE.Mesh(new THREE.BoxGeometry(3.2, 8, 5), materials.port);
    camPort.position.set(20.3, -7.2, 2.6);
    camGroup.add(camPort);
    addLabel(camGroup, "Unit CamS3 5MP / 40×24×11", new THREE.Vector3(0, 17, 0));

    // GPS sits behind CamS3.  The ceramic patch faces the thin rear lid.
    const gpsGroup = register(new THREE.Group(), new THREE.Vector3(0, 14.2, 7.1), new THREE.Vector3(37, -22, 35));
    addRoundedPart(gpsGroup, new THREE.Vector3(48, 24, 8), new THREE.Vector3(), 1.2, materials.gps, 0x42d6ba);
    const antenna = new THREE.Mesh(new THREE.BoxGeometry(39, 17, 0.75), materials.antenna);
    antenna.position.z = 4.35;
    gpsGroup.add(antenna);
    const gpsPort = new THREE.Mesh(new THREE.BoxGeometry(3.2, 8, 5), materials.port);
    gpsPort.position.set(24.2, -7.2, -0.6);
    gpsGroup.add(gpsPort);
    addLabel(gpsGroup, "Unit GPS U032 / 48×24×8", new THREE.Vector3(0, 17, 1));
    addLabel(gpsGroup, "セラミックアンテナ ↑ 背面", new THREE.Vector3(0, 0, 8));

    const wireSpecs = [
      { name: "5V", color: 0xff4b4b, offset: -1.35, toCam: true },
      { name: "GND", color: 0x252d38, offset: -0.45, toCam: true },
      { name: "G10", color: 0xffd84a, offset: 0.45, toCam: false },
      { name: "G11", color: 0xf5f8ff, offset: 1.35, toCam: false }
    ];
    const wireGroup = new THREE.Group();
    scene.add(wireGroup);

    const worldPort = (group, local, factor) => group.userData.base.clone()
      .addScaledVector(group.userData.explode, factor)
      .add(local);

    const tubeMaterial = (color) => new THREE.MeshStandardMaterial({
      color,
      emissive: color,
      emissiveIntensity: color === 0x252d38 ? 0.16 : 0.28,
      roughness: 0.48
    });

    const addTube = (points, material) => {
      const curve = new THREE.CatmullRomCurve3(points, false, "centripetal", 0.45);
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 44, 0.38, 8, false), material);
      wireGroup.add(tube);
    };

    const updateWires = (factor) => {
      while (wireGroup.children.length) {
        const child = wireGroup.children.pop();
        child.geometry.dispose();
        child.material.dispose();
      }

      const junction = new THREE.Vector3(21.2, 17.5, -0.4);
      for (const spec of wireSpecs) {
        const offset = new THREE.Vector3(spec.offset, 0, 0);
        const start = worldPort(watchGroup, new THREE.Vector3(19.5, -24.8, 3.0), factor).add(offset);
        const branch = junction.clone().add(offset);
        const gpsEnd = worldPort(gpsGroup, new THREE.Vector3(24.2, -7.2, -0.6), factor).add(offset);
        const commonMid = new THREE.Vector3(start.x, (start.y + branch.y) / 2, 1.5 + spec.offset * 0.2);
        addTube([start, commonMid, branch], tubeMaterial(spec.color));
        addTube([
          branch,
          new THREE.Vector3(24 + spec.offset, 14.2, 3.0),
          gpsEnd
        ], tubeMaterial(spec.color));

        if (spec.toCam) {
          const camEnd = worldPort(camGroup, new THREE.Vector3(20.3, -7.2, 2.6), factor).add(offset);
          addTube([
            branch,
            new THREE.Vector3(17 + spec.offset, 10.5, -2.4),
            camEnd
          ], tubeMaterial(spec.color));
        }
      }
    };

    const explode = document.querySelector("#explode");
    const explodeValue = document.querySelector("#explode-value");
    const setExplosion = () => {
      const factor = Number(explode.value) / 100;
      for (const group of assemblies) {
        group.position.copy(group.userData.base).addScaledVector(group.userData.explode, factor);
      }
      updateWires(factor);
      explodeValue.value = `${explode.value}%`;
    };
    explode.addEventListener("input", setExplosion);
    setExplosion();

    const clock = new THREE.Clock();
    const animate = () => {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      displayRim.material.opacity = 0.13 + Math.sin(time * 1.4) * 0.035;
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    };
    animate();

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      labelRenderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
