; ToiCamera — Stopwatch host firmware
;
; Setup:
;   1. cp secrets.ini.example secrets.ini   (secrets.ini is gitignored)
;   2. Fill in WiFi credentials, CamS3 URL, Worker URL and device token
;   3. pio run -t upload   (USB-C; hold BOOT ~2s until green LED for download mode)

[platformio]
default_envs = stopwatch
extra_configs = secrets.ini

[env:stopwatch]
platform = espressif32@^6.9.0
board = esp32s3box
framework = arduino
monitor_speed = 115200

; ESP32-S3R8: 16MB flash / 8MB PSRAM (OPI)
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
  ${secrets.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=2

lib_deps =
  m5stack/M5Unified@^0.2.7
  bblanchon/ArduinoJson@^7.2.1
  mikalhart/TinyGPSPlus@^1.0.3
