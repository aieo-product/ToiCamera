<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: "ToiCamera docs" }}</title>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='none' stroke='%23ffd23e' stroke-width='12' stroke-dasharray='180 60' transform='rotate(-135 50 50)'/></svg>">
</head>
<body>
<nav class="site-nav">
  <div class="inner">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="dot"></span>ToiCamera</a>
    <span class="spacer"></span>
    <a class="link" href="{{ '/worker-setup.html' | relative_url }}">Worker Setup</a>
    <a class="link" href="{{ '/print-guide.html' | relative_url }}">Print &amp; Assembly</a>
    <a class="link" href="https://github.com/aieo-product/ToiCamera">GitHub</a>
  </div>
</nav>
<main>
{{ content }}
</main>
<footer class="site">
  <div>ToiCamera — a watch that tells you about what it sees · MIT License ·
  <a href="https://github.com/aieo-product/ToiCamera">aieo-product/ToiCamera</a></div>
</footer>
<script>
document.querySelectorAll('pre').forEach(pre => {
  const btn = document.createElement('button');
  btn.className = 'copy-btn'; btn.textContent = 'copy';
  btn.addEventListener('click', () => {
    navigator.clipboard.writeText(pre.querySelector('code')?.innerText || pre.innerText);
    btn.textContent = 'copied!'; setTimeout(() => btn.textContent = 'copy', 1200);
  });
  pre.appendChild(btn);
});
</script>
</body>
</html>
