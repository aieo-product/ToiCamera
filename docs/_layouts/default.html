<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: "ToiCamera docs" }}</title>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem('toi-lang'); } catch (e) {}
  var nav = (navigator.language || '').slice(0, 2);
  var lang = saved || ({ ja: 'ja', zh: 'zh' }[nav] || 'en');
  document.documentElement.setAttribute('data-lang', lang);
})();
</script>
</head>
<body>
<nav class="site-nav">
  <div class="inner">
    <a class="brand" href="{{ '/' | relative_url }}"><img class="logo" src="{{ '/assets/logo-mark.png' | relative_url }}" alt="">ToiCamera</a>
    <span class="spacer"></span>
    <a class="link" href="{{ '/worker-setup.html' | relative_url }}"><span class="l-en">Worker Setup</span><span class="l-ja">Worker構築</span><span class="l-zh">Worker搭建</span></a>
    <a class="link" href="{{ '/print-guide.html' | relative_url }}"><span class="l-en">Print &amp; Assembly</span><span class="l-ja">印刷・組立</span><span class="l-zh">打印与组装</span></a>
    <a class="link" href="https://github.com/aieo-product/ToiCamera">GitHub</a>
    <span class="lang-switch">
      <button data-setlang="en">EN</button><button data-setlang="ja">日本語</button><button data-setlang="zh">中文</button>
    </span>
  </div>
</nav>
<main>
{{ content }}
</main>
<footer class="site">
  <div>ToiCamera — a watch that tells you about what it sees · MIT License ·
  <a href="https://github.com/aieo-product/ToiCamera">aieo-product/ToiCamera</a></div>
</footer>
<script>
document.querySelectorAll('[data-setlang]').forEach(function (b) {
  b.addEventListener('click', function () {
    var l = b.getAttribute('data-setlang');
    document.documentElement.setAttribute('data-lang', l);
    try { localStorage.setItem('toi-lang', l); } catch (e) {}
  });
});
document.querySelectorAll('pre').forEach(function (pre) {
  var btn = document.createElement('button');
  btn.className = 'copy-btn'; btn.textContent = 'copy';
  btn.addEventListener('click', function () {
    navigator.clipboard.writeText((pre.querySelector('code') || pre).innerText);
    btn.textContent = 'copied!'; setTimeout(function () { btn.textContent = 'copy'; }, 1200);
  });
  pre.appendChild(btn);
});
</script>
</body>
</html>
